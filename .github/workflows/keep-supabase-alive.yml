name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node - <<'NODE'
          const https = require("https");

          const { SUPABASE_URL, SUPABASE_KEY } = process.env;

          if (!SUPABASE_URL || !SUPABASE_KEY) {
            console.error("Missing Supabase GitHub Actions values.");
            console.error("Add them as repository secrets or variables:");
            console.error("- NEXT_PUBLIC_SUPABASE_URL");
            console.error("- NEXT_PUBLIC_SUPABASE_ANON_KEY");
            process.exit(1);
          }

          let url;
          try {
            url = new URL("/rest/v1/leagues", SUPABASE_URL);
          } catch (error) {
            console.error("Invalid NEXT_PUBLIC_SUPABASE_URL.");
            console.error(error.message);
            process.exit(1);
          }

          url.searchParams.set("select", "id");
          url.searchParams.set("limit", "1");

          const req = https.get(
            url,
            {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
              },
              timeout: 10_000,
            },
            (res) => {
              console.log("Status:", res.statusCode);

              let body = "";
              res.setEncoding("utf8");

              res.on("data", (chunk) => {
                body += chunk;
              });

              res.on("end", () => {
                if (!res.statusCode || res.statusCode < 200 || res.statusCode >= 300) {
                  console.error("Supabase ping failed.");
                  console.error("Response:", body.slice(0, 500) || "(empty)");
                  process.exit(1);
                }

                console.log("Supabase ping succeeded.");
              });
            },
          );

          req.on("timeout", () => {
            req.destroy(new Error("Supabase ping timed out."));
          });

          req.on("error", (error) => {
            throw error;
          });

          req.end();
          NODE
