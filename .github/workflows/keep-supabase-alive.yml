name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node - <<'NODE'
          const https = require("https");

          const { SUPABASE_URL, SUPABASE_KEY } = process.env;

          if (!SUPABASE_URL || !SUPABASE_KEY) {
            throw new Error("Missing Supabase GitHub Actions secrets.");
          }

          const url = new URL("/rest/v1/leagues", SUPABASE_URL);
          url.searchParams.set("select", "id");
          url.searchParams.set("limit", "1");

          const req = https.get(
            url,
            {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
              },
              timeout: 10_000,
            },
            (res) => {
              console.log("Status:", res.statusCode);

              if (!res.statusCode || res.statusCode < 200 || res.statusCode >= 300) {
                throw new Error(`Supabase ping failed with status ${res.statusCode}`);
              }

              res.resume();
            },
          );

          req.on("timeout", () => {
            req.destroy(new Error("Supabase ping timed out."));
          });

          req.on("error", (error) => {
            throw error;
          });

          req.end();
          NODE
